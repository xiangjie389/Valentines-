<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine Proposal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ----- Global Styles ----- */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4); /* Light pink gradient background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* ----- Container ----- */
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85); /* Background color and opacity */
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      margin: 20px;
    }

    /* ----- Lego Batman Image ----- */
    .batman {
      width: 200px;
      height: auto;
      margin-bottom: 20px;
      animation: batmanAnimation 2s ease-in-out infinite;
    }

    /* Animation for Lego Batman's position */
    @keyframes batmanAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* ----- Heading and Text ----- */
    h1 {
      font-size: 2.5em;
      color: #ff1493; /* Hot pink for the heading */
      margin-bottom: 20px;
    }
    
    p {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 20px;
    }

    /* ----- Buttons Styling ----- */
    button {
      background: #ff1493;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 1.2em;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      margin: 10px;
    }
    
    button:hover {
      background: #d81b60;
    }

    /* ----- Button Enlarging Effect ----- */
    .grow {
      transition: transform 0.3s ease;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Lego Batman Image -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Lego_Batman_Logo.svg/1024px-Lego_Batman_Logo.svg.png" class="batman" alt="Lego Batman" id="batmanImage">
    
    <!-- Main Proposal Text -->
    <h1>Happy Valentine's Day!</h1>
    <p>Will you be my Valentine?</p>
    
    <!-- Interactive Buttons -->
    <button class="yes" id="yesButton" onclick="enlargeYesButton()">Yes, I will!</button>
    <button class="no" id="noButton" onclick="changeNoText()">No...</button>
    
    <!-- Hidden Extra Message -->
    <p id="extraMessage" style="display: none; margin-top: 20px;">
      YEAHHHHH!!!!! I LOVEEE YOUUUUUU!!! 😘😘
    </p>
  </div>

  <script>
    let yesButton = document.getElementById('yesButton');
    let noButton = document.getElementById('noButton');
    let batmanImage = document.getElementById('batmanImage');
    let extraMessage = document.getElementById('extraMessage');
    let noTextCounter = 0; // Track the number of "No" button presses

    // Function to reveal the extra message on "Yes" button click
    function enlargeYesButton() {
      yesButton.classList.add('grow');
      let currentScale = parseFloat(yesButton.style.transform.replace('scale(', '').replace(')', '')) || 1;
      let newScale = currentScale + 0.1;
      yesButton.style.transform = `scale(${newScale})`;
      
      // If you want the extra message to show after "Yes"
      extraMessage.style.display = 'block';
    }

    // Function to change the "No" button text on each press and enlarge the "Yes" button
    function changeNoText() {
      noTextCounter++;
      
      if (noTextCounter === 1) {
        noButton.innerText = "Are you sure?";
      } else if (noTextCounter === 2) {
        noButton.innerText = "Think about it...";
      } else if (noTextCounter === 3) {
        noButton.innerText = "You're breaking my heart!";
      } else {
        noButton.innerText = "Just say yes! 😢";
      }

      // Make the "Yes" button bigger when "No" is clicked
      let currentScale = parseFloat(yesButton.style.transform.replace('scale(', '').replace(')', '')) || 1;
      let newScale = currentScale + 0.1;
      yesButton.style.transform = `scale(${newScale})`;
    }
  </script>
</body>
</html>
