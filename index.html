<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine Proposal</title>
  <style>
    /* ----- Global Styles ----- */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4); /* Change gradient colors here */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ----- Container ----- */
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85); /* Background color and opacity */
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      margin: 20px;
      position: relative;
      z-index: 1;
    }

    /* ----- Heading and Text ----- */
    h1 {
      font-size: 2.5em;
      color: #e91e63; /* Change heading color here */
      margin-bottom: 20px;
    }
    
    p {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 20px;
    }

    /* ----- Animated Heart ----- */
    .heart {
      font-size: 4em;
      color: #e91e63; /* Change heart color here */
      animation: beat 1s infinite;
      margin-bottom: 20px;
    }
    
    @keyframes beat {
      0% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* ----- Yes Button Styling ----- */
    #yesButton {
      background: #e91e63;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 1.2em;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    #yesButton:hover {
      background: #d81b60;
    }

    /* ----- No Button Styling ----- */
    #noButton {
      background: #ff4081;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 1.2em;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    #noButton:hover {
      background: #d81b60;
    }

    /* ----- Hidden Extra Message ----- */
    #extraMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      display: none;
      z-index: 2;
      text-align: center;
    }

    /* ----- Blur Effect on Background ----- */
    .blurred {
      filter: blur(5px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <!-- Animated Heart Icon -->
    <div class="heart">&#10084;</div>
    <!-- Main Proposal Text -->
    <h1>Happy Valentine's Day!</h1>
    <p>Will you be my Valentine?</p>
    <!-- Interactive Yes Button -->
    <button id="yesButton" onclick="showExtraMessage()">Yes, I will!</button>
    <!-- Interactive No Button -->
    <button id="noButton" onclick="handleNoClick()">No</button>
    <!-- Hidden Extra Message -->
    <div id="extraMessage">
      YAYYY!!!! I LOVE YOUUUUU!!! 😘😘
    </div>
  </div>

  <script>
    let noClickCount = 0;

    // Function to handle the No button click
    function handleNoClick() {
      // Change the text of the No button each time it's clicked
      const noButton = document.getElementById('noButton');
      const texts = ["Are you sure?", "Come on, say yes!", "Why not?", "Just say yes!", "I know you want to 😎"];
      noButton.textContent = texts[noClickCount % texts.length]; // Change text in a loop

      // Grow the Yes button each time No is clicked
      const yesButton = document.getElementById('yesButton');
      const scale = 1 + (noClickCount * 0.1); // Increase size on each click
      yesButton.style.transform = `scale(${scale})`;
      noClickCount++;
    }

    // Function to show the extra message and blur the background when Yes is clicked
    function showExtraMessage() {
      // Show the extra message
      document.getElementById('extraMessage').style.display = 'block';

      // Blur the background and disable interaction with it
      document.getElementById('mainContainer').classList.add('blurred');
    }
  </script>
</body>
</html>
